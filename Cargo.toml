[workspace]
resolver = "2"
members = ["crates/lurq", "crates/gallery", "crates/mobile_demo", "crates/lurq_macros"]

[workspace.dependencies]
parking_lot = "0.12.5"
tracing = "0.1"

# Text shaping at opt-level 0 makes text-heavy screens crawl in dev builds.
[profile.dev.package.cosmic-text]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

# cosmic-text shapes with harfrust; rustybuzz remains for usvg text.
[profile.dev.package.harfrust]
opt-level = 2

[profile.dev.package.rustybuzz]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2

[profile.dev.package.fontdb]
opt-level = 2

[profile.dev.package.unicode-bidi]
opt-level = 2

[profile.dev.package.unicode-linebreak]
opt-level = 2

[profile.dev.package.unicode-script]
opt-level = 2

# Swash's font outline/hinting dependencies account for most remaining cold glyph cost.
[profile.dev.package.skrifa]
opt-level = 2

[profile.dev.package.read-fonts]
opt-level = 2

[profile.dev.package.font-types]
opt-level = 2

# A page's build: the gallery's `scripts/gallery-web.py`, and what `docs/src/content/docs/web.md` gives an app. What
# a page downloads is its size: the gallery's module is 25 MB with `z` and 39 MB with release's 3 (8.6 and 11.6 MB
# gzipped), and its frames and its first frame measured the same (`scripts/gallery-web-bench.py`, 2026-11-19). Fat LTO
# with one codegen unit took more than forty minutes to build the gallery and was not finished.
[profile.web]
inherits = "release"
opt-level = "z"
