[package]
name = "mobile_demo"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
# Lets an agent drive the app and take screenshots of it; see `lurq::mcp`.
mcp = ["lurq/mcp"]
# Addresses on the network: the Sound screen's last player loads one. Without it that player says the build
# loads no address.
http = ["lurq/http"]
# The glass probe: what a glass costs a frame, measured in the app (`src/glass_probe.rs`).
probe = ["lurq/perf_profile"]

[dependencies]
lurq = { version = "=0.76.0", path = "../lurq", default-features = false, features = ["winit", "wgpu", "router", "media"] }
