[package]
name = "lurq_macros"
version = "0.1.0"
edition = "2021"
description = "Proc macros for the lurq UI toolkit."
license = "MIT"
repository = "https://github.com/ivanzaida/lurq"
homepage = "https://ivanzaida.github.io/lurq/"
documentation = "https://docs.rs/lurq_macros"
readme = "../../README.md"
keywords = ["ui", "gui", "macros"]
categories = ["development-tools::procedural-macro-helpers", "gui"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
