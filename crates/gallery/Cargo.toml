[package]
name = "gallery"
default-run = "gallery"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
# Lets the running app be driven and captured over lurq's MCP server.
mcp = ["lurq/mcp"]
devtools = ["lurq/devtools"]
# lurq's own Direct3D 12 renderer, to see the gallery through it: `--backend native-dx12`.
dx12 = ["lurq/dx12"]

[dependencies]
lurq = { version = "=0.61.1", path = "../lurq", default-features = false, features = ["winit", "wgpu", "router", "form", "clipboard", "image", "file_dialog", "regex", "markdown", "canvas", "media"] }

# Addresses on the network, for the sound the Audio Player page plays from one. Not in a browser: the client is
# not built for one, and the loader loads no address there yet.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lurq = { version = "=0.61.1", path = "../lurq", default-features = false, features = ["http"] }

# The decoder of the Video Player page that stands for an app's own: a Direct3D 11 device that writes
# textures lurq draws (`src/card_demo.rs`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
] }

# The gallery as a page: `scripts/gallery-web.py`. What it asks the browser for is in `src/web.rs`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# A browser without WebGPU draws the gallery through WebGL2.
lurq = { version = "=0.61.1", path = "../lurq", default-features = false, features = ["webgl", "form", "regex", "markdown", "canvas"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "Location",
    "Node",
    "Response",
    "Window",
    "console",
] }
