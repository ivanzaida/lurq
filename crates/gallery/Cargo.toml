[package]
name = "gallery"
default-run = "gallery"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
# Lets the running app be driven and captured over lurq's MCP server.
mcp = ["lurq/mcp"]
devtools = ["lurq/devtools"]

[dependencies]
lurq = { version = "=0.61.1", path = "../lurq", default-features = false, features = ["winit", "wgpu", "router", "clipboard", "image", "file_dialog", "regex", "markdown", "canvas"] }

# The gallery as a page: `scripts/gallery-web.py`. What it asks the browser for is in `src/web.rs`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# A browser without WebGPU draws the gallery through WebGL2.
lurq = { version = "=0.61.1", path = "../lurq", default-features = false, features = ["webgl", "regex", "markdown", "canvas"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "Location",
    "Node",
    "Response",
    "Window",
    "console",
] }
