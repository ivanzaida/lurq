[package]
name = "lurq"
version = "0.1.0"
edition = "2024"

[features]
default = []
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
bytemuck = { version = "1", features = ["derive"], optional = true }
cosmic-text = "0.12"
parking_lot.workspace = true
paste = "1"
pollster = { version = "0.4", optional = true }
raw-window-handle = "0.6"
wgpu = { version = "24", optional = true }
