[package]
name = "lurq"
version = "0.62.0"
edition = "2024"
description = "A Rust UI toolkit with typed components, retained state, reactive signals, GPU rendering, and DevTools."
license = "MIT"
repository = "https://github.com/ivanzaida/lurq"
homepage = "https://ivanzaida.github.io/lurq/"
documentation = "https://docs.rs/lurq"
readme = "../../README.md"
# What is published is named here: a file put anywhere else in this directory stays out of the package. The manifest
# and the readme are packaged whatever this says. Unit tests in `src` read fonts from `tests/assets`.
include = ["/src/**", "/assets/**", "/tests/**", "/benches/**", "/examples/**"]
keywords = ["ui", "gui", "reactive", "wgpu", "devtools"]
categories = ["gui", "rendering"]

[features]
# A desktop app: a window, its GPU renderer, the clipboard, the file dialog, pictures, drawing, forms, routes and
# queries. A browser app takes none of it (`arboard` has no browser) and names its own list:
# `default-features = false, features = ["webgl", "image", "canvas", "form", "router", "query"]`.
default = ["winit", "wgpu", "clipboard", "file_dialog", "image", "canvas", "form", "router", "query"]

# --- The window and the GPU ---

# The window, its events and its loop (`lurq::app::WinitWindow`).
winit = ["dep:winit"]
# The GPU renderer: Vulkan, Metal, Direct3D 12 or WebGPU, as wgpu picks. On Windows it has Direct3D 11 to read the
# frames of a decoder that is on another card than the one it draws on.
wgpu = [
    "render",
    "dep:wgpu",
    "dep:pollster",
    "dep:objc2-metal",
    "dep:wgpu-hal",
    "dep:core-video-sys",
    "windows/Win32_Graphics_Direct3D11",
]
# In a browser without WebGPU the `wgpu` renderer draws through WebGL2. It adds wgpu's own implementation and its
# shader translator to the page's binary, so an app asks for it. Nothing changes outside a browser.
#
# `fragile-send-sync-non-atomic-wasm`: lurq keeps GPU objects in types that are `Send + Sync` on a desktop. wgpu's
# own implementation is neither in a browser unless told that the page has one thread, which a page built
# without atomics has.
webgl = ["wgpu", "wgpu/webgl", "wgpu/fragile-send-sync-non-atomic-wasm"]
# lurq's own Direct3D 12 renderer on Windows, beside `wgpu`. It has Direct3D 11 to read the frames of a decoder
# that is on another card than the one it draws on.
dx12 = ["render", "windows/Win32_Graphics_Direct3D11"]

# --- What the system gives ---

# The system clipboard (`lurq::clipboard`); `png` encodes a clipboard image to store it (`ClipboardImage::to_png`).
clipboard = ["dep:arboard", "dep:png"]
# The system's dialog for files to open behind `lurq::files::FileDialog` (`rfd`; none on iOS).
file_dialog = ["dep:rfd"]

# --- Pictures and drawing ---

# Pictures from files and bytes: PNG, JPEG, WebP, GIF, BMP and TIFF (`lurq::images`, `ui::Picture`).
image = ["raster", "dep:image"]
# Drawing: `lurq::canvas` and what draws with it (`ui` charts, `Sparkline`, `Gauge`, `SignaturePad`), and SVG
# (`lurq::svg`, an SVG picture or icon). `png` writes a signature as a PNG file (`ui::Signature::to_png`); it is
# the version `image` reads with, so a build has one.
canvas = ["raster", "render", "dep:tiny-skia", "dep:lyon", "dep:png", "dep:usvg"]
# Playing a video or a sound: `lurq::media`, `ui::VideoPlayer::source` and `ui::AudioPlayer::source`. On Windows it
# decodes with Media Foundation and plays its sound through WASAPI; on macOS and iOS it plays a sound with the
# system's `AVAudioPlayer`. A sound at an address is loaded with `http`.
media = [
    "raster",
    "dep:objc2-avf-audio",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Media_Audio",
    "windows/Win32_Media_MediaFoundation",
    "windows/Win32_System_Com",
    "windows/Win32_System_Com_StructuredStorage",
    "windows/Win32_System_Variant",
    "windows/Win32_UI_Shell",
]
# Internal: pixels in memory and their way to the GPU, under `image`, `canvas` and `media`. Not for an app to name.
raster = ["dep:core-video-sys"]
# Internal: what the renderers share, under `wgpu`, `dx12` and `canvas`. Not for an app to name.
render = ["dep:bytemuck"]
# A GPU capture of the next whole frame of a window, encoded as a PNG by `image`. `devtools` and `mcp` take it.
screenshot = ["image"]

# --- What an app is built of ---

# Forms: form handles, their controls' values, validation and submission (`Ctx::form`).
form = []
# Routes: `lurq::router`, links, outlets and the history of navigation.
router = []
# Queries: `lurq::query` and `#[query]`, shared reads that are kept and invalidated by type.
query = []
# Markdown: parsing it and the components that show and edit it (`ui::Markdown`, `ui::RichTextEditor`).
markdown = ["dep:pulldown-cmark", "dep:unicode-bidi", "dep:unicode-linebreak"]
# Addresses on the network, for everything that loads: the client and its TLS. A file, bytes and a resource of
# the app are loaded by every build.
http = ["dep:ureq"]
# `ui::find_matches` takes a regular expression where its options say so (`FindOptions::regex`).
regex = ["dep:regex"]
# Values kept on the disk between runs (`lurq::persistent_storage`, `#[derive(PersistentValue)]`).
persistent_storage = ["dep:redb"]
# JSON: an app's translations read from JSON (`I18n::from_json`), and the Profiler's recording files.
serde = ["dep:serde_json"]
# Futures run on a Tokio handle the app gives `App`.
tokio = ["dep:tokio"]

# --- For the developer ---

# DevTools: the inspector of the element tree, components and signals, and the Profiler.
# `serde_json` writes and reads the Profiler tab's recording files.
# `inventory` gathers the inspectors types register, so that DevTools reads a value it is given with no bound.
devtools = ["screenshot", "dep:rfd", "dep:serde_json", "dep:inventory", "perf_profile"]
# Timings of each frame's phases, read by the Profiler and the MCP server's profiling tools.
perf_profile = []
# `lurq::app::profiler::CountingAllocator`, a global allocator wrapper the
# application installs so profiling sessions report allocations per frame.
counting_allocator = ["perf_profile"]
# Embeddable MCP server: lets an AI agent drive and inspect a running lurq app
# (screenshot, read the element tree, click/type, navigate). Off by default;
# nothing listens unless the app also calls `Tree::enable_mcp`.
mcp = [
    "screenshot",
    "dep:rmcp",
    "dep:tokio",
    "tokio/net",
    "tokio/time",
    "dep:tokio-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:tower-service",
    "dep:base64",
    "dep:uuid",
    "dep:serde_json",
    "dep:tracing-subscriber",
    "dep:libc",
]

[dependencies]
bytemuck = { version = "1", features = ["derive"], optional = true }
# `shape-run-cache` keeps the glyphs of shaped words: a word shaped in one text is not shaped again in the next.
cosmic-text = { version = "0.19", features = ["shape-run-cache"] }
parking_lot.workspace = true
paste = "1"
png = { version = "0.18", optional = true }
pollster = { version = "0.4", optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false, optional = true }
# The bidi classes and line breaks cosmic-text already uses, for Markdown links.
unicode-bidi = { version = "0.3.18", optional = true }
unicode-linebreak = { version = "0.1.5", optional = true }
# Grapheme boundaries inside a ligature, as cosmic-text splits them.
unicode-segmentation = "1.12"
raw-window-handle = "0.6"
redb = { version = "4.1.0", optional = true }
# Regular expressions in `ui::find_matches`, the search of a find bar's text.
regex = { version = "1.13", optional = true }
swash = "0.2.10"
# The TrueType interpreter under swash, driven directly for grid-fitted fonts: swash's own
# scaler drops every hint along x. Kept at the version swash resolves to.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
wgpu = { version = "=29.0.4", optional = true }
winit = { version = "0.30", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"], optional = true }
usvg = { version = "0.45", optional = true }
lyon = { version = "1", optional = true }
tiny-skia = { version = "0.11", optional = true, default-features = false, features = ["std", "simd"] }
ureq = { version = "3.3.0", optional = true }
# What registers a type's inspector before `main`, for DevTools to find it by the type alone.
inventory = { version = "0.3", optional = true }
# `float_roundtrip` reads back every f64 a recording file holds exactly.
serde_json = { version = "1", optional = true, features = ["float_roundtrip"] }
tokio = { version = "1.52.3", optional = true, features = ["rt", "rt-multi-thread", "sync"] }
tracing.workspace = true
lurq_macros = { version = "0.1.2", path = "../lurq_macros" }

# MCP server (feature `mcp`); all optional so the default build stays lean.
rmcp = { version = "3.9", features = ["server", "transport-streamable-http-server"], optional = true }
tokio-util = { version = "0.7", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
tower-service = { version = "0.3", optional = true }
base64 = { version = "0.22", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"], optional = true }

# The system clipboard. A browser has none `arboard` can reach: see `clipboard::web`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3", optional = true }

# The browser: the page's canvas, its clipboard, and the promises a GPU device comes from.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# The page's clock, behind `lurq::time`: std's `Instant::now` and `SystemTime::now` panic in a browser.
web-time = "1"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    # A file the browser's file input gives (`lurq::files`).
    "File",
    "Blob",
    "History",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    # What the page says of the device's pointer (`app::Pointer`).
    "MediaQueryList",
    "MouseEvent",
    "Navigator",
    "Node",
    # A pen's pointer events, which winit gives as the mouse's (`winit_shell::web::PenPointer`).
    "PointerEvent",
    "PopStateEvent",
    "WheelEvent",
    "Window",
    "console",
] }

# `windows` is needed on Windows regardless of the render backend: the winit
# shell uses it for native title-bar drag/resize under a plain `cfg(windows)`.
# Keeping it here (rather than behind the `dx12` feature) lets lurq build with
# the wgpu backend alone. The Direct3D12/DXGI features are only used by the
# feature-gated dx12 renderer, but are always available so any feature set links.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    # `ShellExecuteW`, which opens an address (`app::open_url`).
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The DevTools save dialog and `lurq::files::FileDialog`. `rfd` has no iOS backend and does not compile there.
[target.'cfg(not(target_os = "ios"))'.dependencies]
# `file-handle-inner` gives the browser's file behind a handle, whose size the picker tells.
rfd = { version = "0.15", optional = true, features = ["file-handle-inner"] }

# Unix: `kill(pid, 0)` tells the MCP server which discovery files belong to
# processes that no longer run.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

# iOS: the winit shell reaches UIKit for what winit leaves out (a display link, the status bar's tap).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
# The reply of the system's check of who the person is; see `app::biometry`.
block2 = "0.6"
# The scripts cosmic-text asks a fallback font for; see `glyph_engine::ios_fallback`.
unicode-script = "0.5"
# What `lurq::media` gives the system's player of a sound and is given back by it.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSObject", "NSData", "NSError", "NSURL"] }

# The sound of `lurq::media` on macOS and iOS: the system's `AVAudioPlayer`. The data, the addresses and the
# errors it takes and gives are `objc2-foundation`'s, in each system's own table.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioPlayer"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
core-video-sys = { version = "0.1", default-features = false, optional = true }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLPixelFormat"], optional = true }
objc2 = "0.6"
# `objc2-core-foundation` gives `NSPoint` for `NSEvent::mouseLocation` (the pointer during a file drag).
# `NSColorSampler` and `block2` for `lurq::eyedropper`: the system's sampler of a color from the screen.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSEvent", "NSResponder", "objc2-core-foundation", "NSColor", "NSColorSampler", "NSColorSpace", "block2"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSObject", "objc2-core-foundation", "NSData", "NSError", "NSURL"] }
wgpu-hal = { version = "=29.0.4", features = ["metal"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
raw-window-handle = "0.6"
taffy = "0.15.1"
# Reads back the PNG a signature is written as (`tests/ui/signature_pad.rs`).
png = "0.18"
# Reads back the QR codes `ui::QrCode` draws, in its tests.
rqrr = { version = "0.11", default-features = false }

# Extra Win32 surface for the dx12_capture_check example's bare test window.
[target.'cfg(windows)'.dev-dependencies]
# The audio features are for the test that listens to what a media plays: the system's meter of this process.
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
] }

