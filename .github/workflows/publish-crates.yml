name: Publish crates

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Validate crates
        run: |
          cargo test -p lurq_macros
          cargo check -p lurq
          cargo test -p lurq --test input_tests checkbox
          cargo test -p lurq --features resources --test resources_tests
          cargo test -p lurq --features svg --test svg_tests
          cargo test -p lurq --features svg --lib rasterize

      - name: Publish changed versions
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          crate_version() {
            local crate="$1"
            cargo metadata --no-deps --format-version 1 \
              | jq -r ".packages[] | select(.name == \"$crate\") | .version"
          }

          crate_version_exists() {
            local crate="$1"
            local version="$2"
            local status
            status="$(curl -sS -H "User-Agent: ivanzaida/lurq publish workflow" -o /tmp/crate-version.json -w "%{http_code}" "https://crates.io/api/v1/crates/${crate}/${version}")"
            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *)
                cat /tmp/crate-version.json
                echo "::error::crates.io returned HTTP ${status} while checking ${crate} ${version}"
                exit 1
                ;;
            esac
          }

          wait_for_crate_version() {
            local crate="$1"
            local version="$2"
            for attempt in {1..30}; do
              if crate_version_exists "$crate" "$version"; then
                return 0
              fi
              echo "Waiting for ${crate} ${version} to appear in crates.io index (${attempt}/30)..."
              sleep 10
            done
            echo "::error::Timed out waiting for ${crate} ${version} to appear on crates.io"
            exit 1
          }

          publish_if_needed() {
            local crate="$1"
            local version
            version="$(crate_version "$crate")"
            if crate_version_exists "$crate" "$version"; then
              echo "${crate} ${version} is already published; skipping."
              return 0
            fi

            if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
              echo "::error::Missing CARGO_REGISTRY_TOKEN repository secret"
              exit 1
            fi

            echo "Publishing ${crate} ${version}..."
            cargo publish -p "$crate" --dry-run
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"
            wait_for_crate_version "$crate" "$version"
          }

          publish_if_needed lurq_macros
          publish_if_needed lurq
